name: Pipeline

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started the run: manual (this button) or scheduler (cron-job.org)"
        type: choice
        options: [manual, scheduler]
        default: manual

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      DRY_RUN: ${{ vars.DRY_RUN }}
      USER_AGENT: ${{ vars.USER_AGENT }}
      TRIGGER_SOURCE: ${{ inputs.source }}
      MIN_FETCH_INTERVAL_HOURS: ${{ vars.MIN_FETCH_INTERVAL_HOURS }}
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:deploy

      - run: pnpm pipeline:run
